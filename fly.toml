# fly.toml — webhook on Fly, Neon as the database
app = "chaharsotoon-charbot"
primary_region = "fra"

[build]

[env]
  BOT_MODE = "webhook"
  PORT = "8081"
  WEBHOOK_PATH = "/telegram/webhook"
  HOST = "0.0.0.0"
  CHARBOT_WHISPER_MODEL = "tiny"
  CHARBOT_ASR_MODEL = "gpt-4o-mini-transcribe"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"
